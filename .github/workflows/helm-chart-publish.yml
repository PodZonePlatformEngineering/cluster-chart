# Template A: Helm Chart Publish
# Target repo type: helm-chart
# Usage: copy to .github/workflows/helm-chart-publish.yml in the target repo
#
# Triggers on version tag push (e.g. v0.1.39)
# Publishes the chart to GitHub Releases and OCI (ghcr.io/podzoneplatformengineering/<chart-name>)

name: Publish Helm Chart

on:
  push:
    tags:
      - 'v*'

env:
  CHART_NAME: ${{ github.event.repository.name }}
  OCI_REGISTRY: ghcr.io/podzoneplatformengineering

jobs:
  publish:
    name: Package and publish chart
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Package chart
        run: helm package . --version ${{ steps.version.outputs.version }} --app-version ${{ steps.version.outputs.version }}

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: "${{ env.CHART_NAME }}-${{ steps.version.outputs.version }}.tgz"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username ${{ github.actor }} --password-stdin

      - name: Push to OCI registry
        run: helm push "${{ env.CHART_NAME }}-${{ steps.version.outputs.version }}.tgz" oci://${{ env.OCI_REGISTRY }}
